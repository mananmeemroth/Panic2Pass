services:
  - type: web
    name: panic2pass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434/v1
      - key: OLLAMA_MODEL
        value: llama3.2:3b
